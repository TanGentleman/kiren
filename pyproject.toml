[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kiren"
version = "0.2.0"
description = "Search PubMed and export the articles to CSV, Excel or PDF"
readme = "README.md"
authors = [{ name = "TanGentleman", email = "tanuj@cmu.edu" }]
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "xmltodict>=0.13",
    "pandas>=2.1",
    "openpyxl>=3.1",
    "reportlab>=4.0",
]

[project.scripts]
kiren = "pubmed_tools.cli:run"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "pypdf>=5", "ruff>=0.15"]

[tool.setuptools.packages.find]
include = ["pubmed_tools*"]

[tool.setuptools.package-data]
pubmed_tools = ["fonts/*.ttf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=pubmed_tools --cov-report=term-missing"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
