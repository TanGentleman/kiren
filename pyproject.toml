[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kiren"
version = "0.2.0"
description = "Search PubMed, export articles to CSV, Excel or PDF, and look up papers by DOI"
readme = "README.md"
authors = [{ name = "TanGentleman", email = "tanuj@cmu.edu" }]
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "xmltodict>=0.13",
    "pandas>=2.1",
    "openpyxl>=3.1",
    "reportlab>=4.0",
]

[project.optional-dependencies]
web = ["fastapi>=0.115", "uvicorn>=0.30"]

[project.scripts]
kiren = "pubmed_tools.cli:run"
kiren-doi = "pubmed_tools.openalex:run"
kiren-web = "pubmed_tools.web:run"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pypdf>=5",
    "ruff>=0.15",
    "fastapi>=0.115",
    "httpx>=0.27",
    "uvicorn>=0.30",
]

[tool.setuptools.packages.find]
include = ["pubmed_tools*"]

[tool.setuptools.package-data]
pubmed_tools = ["fonts/*.ttf", "static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=pubmed_tools --cov-report=term-missing"

[tool.ruff]
line-length = 100
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
