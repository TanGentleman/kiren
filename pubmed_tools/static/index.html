<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kiren – Paper Metadata</title>
    <style>
      :root {
        --bg: #0b0f14;
        --panel: #121821;
        --text: #e6edf3;
        --muted: #a3b1c2;
        --accent: #4ea2f5;
        --accent-2: #7bd389;
        --error: #ff6b6b;
        --border: #1d2633;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
        color: var(--text);
        background: radial-gradient(1200px 600px at 80% -10%, #122033 0%, #0b0f14 40%), var(--bg);
      }
      .container {
        max-width: 900px;
        margin: 4rem auto;
        padding: 1.5rem;
      }
      .card {
        background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
        border: 1px solid var(--border);
        border-radius: 14px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.25);
        overflow: hidden;
      }
      .header {
        padding: 1.25rem 1.25rem 0.5rem 1.25rem;
        display: flex;
        align-items: center;
        gap: 0.75rem;
      }
      .logo {
        width: 28px; height: 28px; border-radius: 8px; background: linear-gradient(135deg, var(--accent), var(--accent-2));
      }
      h1 { font-size: 1.15rem; margin: 0; font-weight: 600; letter-spacing: 0.2px; }
      p.subtitle { margin: 0.25rem 0 0.75rem; color: var(--muted); font-size: 0.95rem; }
      form { display: flex; gap: 0.5rem; padding: 1rem 1.25rem 1.25rem; border-bottom: 1px solid var(--border); }
      input[type="url"] {
        flex: 1;
        padding: 0.85rem 0.95rem;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: #0e141c;
        color: var(--text);
        outline: none;
      }
      input[type="url"]::placeholder { color: #7a8aa0; }
      button {
        padding: 0.85rem 1rem;
        border-radius: 10px;
        border: 1px solid rgba(78,162,245,0.35);
        background: linear-gradient(180deg, rgba(78,162,245,0.25), rgba(78,162,245,0.12));
        color: var(--text);
        font-weight: 600;
        cursor: pointer;
      }
      button:disabled { opacity: 0.6; cursor: progress; }
      .content { padding: 1rem 1.25rem 1.25rem; }
      .meta { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem 1.25rem; margin-bottom: 1rem; }
      .meta div { background: #0e141c; border: 1px solid var(--border); border-radius: 10px; padding: 0.75rem; }
      .meta .label { color: var(--muted); font-size: 0.8rem; margin-bottom: 0.35rem; }
      .abstract { line-height: 1.6; color: #d7e2ec; white-space: pre-wrap; }
      .error { color: var(--error); margin-top: 0.75rem; }
      .row { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; }
      .pill { padding: 0.25rem 0.55rem; border-radius: 999px; background: #0e141c; border: 1px solid var(--border); color: #cfe1f5; font-size: 0.8rem; }
      .actions { display: flex; gap: 0.5rem; justify-content: flex-end; margin-top: 0.75rem; }
      .json {
        background: #0e141c; border: 1px solid var(--border); border-radius: 10px; padding: 0.75rem; overflow: auto;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        color: #e6edf3; font-size: 0.85rem;
      }
      @media (max-width: 720px) {
        .meta { grid-template-columns: 1fr; }
        form { flex-direction: column; }
        button { width: 100%; }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="card">
        <div class="header">
          <div class="logo" aria-hidden="true"></div>
          <div>
            <h1>Paper Metadata</h1>
            <p class="subtitle">Enter a DOI or canonical URL to fetch title, authors, keywords, counts and abstract.</p>
          </div>
        </div>
        <form id="form">
          <input id="url" type="url" placeholder="https://doi.org/10.1093/scan/nsq093" required />
          <button id="btn" type="submit">Fetch</button>
        </form>
        <div class="content">
          <div id="error" class="error" style="display:none"></div>
          <div id="result" style="display:none">
            <div class="meta">
              <div>
                <div class="label">Title</div>
                <div id="title">—</div>
              </div>
              <div>
                <div class="label">Publication Date</div>
                <div id="pubdate">—</div>
              </div>
              <div>
                <div class="label">Authors</div>
                <div id="authors" class="row"></div>
              </div>
              <div>
                <div class="label">Keywords</div>
                <div id="keywords" class="row"></div>
              </div>
              <div>
                <div class="label">Cited By</div>
                <div id="cited">—</div>
              </div>
              <div>
                <div class="label">Source URL</div>
                <div><a id="link" href="#" target="_blank" rel="noopener noreferrer">Open</a></div>
              </div>
            </div>
            <div class="label">Abstract</div>
            <div id="abstract" class="abstract">—</div>
            <div class="actions">
              <button id="copy">Copy JSON</button>
              <button id="download">Download JSON</button>
            </div>
            <div id="json" class="json" style="margin-top:0.75rem"></div>
          </div>
        </div>
      </div>
    </div>
    <script>
      const form = document.getElementById('form');
      const urlInput = document.getElementById('url');
      const btn = document.getElementById('btn');
      const errorEl = document.getElementById('error');
      const resultEl = document.getElementById('result');
      const titleEl = document.getElementById('title');
      const pubdateEl = document.getElementById('pubdate');
      const authorsEl = document.getElementById('authors');
      const keywordsEl = document.getElementById('keywords');
      const citedEl = document.getElementById('cited');
      const abstractEl = document.getElementById('abstract');
      const jsonEl = document.getElementById('json');
      const linkEl = document.getElementById('link');
      const copyBtn = document.getElementById('copy');
      const downloadBtn = document.getElementById('download');

      function setLoading(isLoading) {
        btn.disabled = isLoading;
        btn.textContent = isLoading ? 'Fetching…' : 'Fetch';
      }

      function toPills(container, items) {
        container.innerHTML = '';
        (items || []).forEach(item => {
          const span = document.createElement('span');
          span.className = 'pill';
          span.textContent = item;
          container.appendChild(span);
        });
      }

      function showError(message) {
        errorEl.style.display = 'block';
        errorEl.textContent = message;
        resultEl.style.display = 'none';
      }

      function showResult(data) {
        errorEl.style.display = 'none';
        resultEl.style.display = 'block';
        titleEl.textContent = data.title || '—';
        pubdateEl.textContent = data.publication_date || '—';
        toPills(authorsEl, data.authors || []);
        toPills(keywordsEl, data.keywords || []);
        citedEl.textContent = (data.cited_by_count ?? '—');
        abstractEl.textContent = data.abstract || '—';
        linkEl.href = data.url || '#';
        jsonEl.textContent = JSON.stringify(data, null, 2);
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const value = urlInput.value.trim();
        if (!value) return;
        setLoading(true);
        try {
          const resp = await fetch(`/get?url=${encodeURIComponent(value)}`);
          if (!resp.ok) {
            const text = await resp.text();
            throw new Error(text || `Request failed with ${resp.status}`);
          }
          const data = await resp.json();
          showResult(data);
        } catch (err) {
          showError(err.message || 'Failed to fetch metadata');
        } finally {
          setLoading(false);
        }
      });

      copyBtn.addEventListener('click', async (e) => {
        e.preventDefault();
        try {
          await navigator.clipboard.writeText(jsonEl.textContent);
          copyBtn.textContent = 'Copied!';
          setTimeout(() => (copyBtn.textContent = 'Copy JSON'), 1000);
        } catch {}
      });

      downloadBtn.addEventListener('click', (e) => {
        e.preventDefault();
        const blob = new Blob([jsonEl.textContent], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'paper_metadata.json';
        a.click();
        URL.revokeObjectURL(a.href);
      });
    </script>
  </body>
  </html>
